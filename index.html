      { id: 2, jenis_kas: "Wajib", tipe: "Masuk", nominal: 450000, penyetor: "Ahmad Junaedi", keterangan: "Iuran Warga RT 14 Bulan Juli", tanggal: "2026-08-02" },

    ];

    // KOMPONEN UTAMA APPS
    function App() {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('beranda');

      const [warga, setWarga] = useState(INITIAL_WARGA);

      const [pengurus, setPengurus] = useState(INITIAL_PENGURUS);
      const [passwords, setPasswords] = useState(INITIAL_PASSWORDS);

      // Memuat Data dari Google Sheets
      const loadDataFromGSheet = async () => {
        if (!API_URL || API_URL.includes("GANTI_DENGAN_DEPLOYMENT_URL_ANDA")) {
          return;
        }
        setLoading(true);
        try {
          const response = await fetch(`${API_URL}?action=getAllData`);
          const data = await response.json();
          if (data) {
            if (data.warga && Array.isArray(data.warga) && data.warga.length > 0) setWarga(data.warga);
            if (data.pengumuman && Array.isArray(data.pengumuman)) setPengumuman(data.pengumuman);
            if (data.kegiatan && Array.isArray(data.kegiatan)) setKegiatan(data.kegiatan);
            if (data.laporan && Array.isArray(data.laporan)) setLaporan(data.laporan);
            if (data.keuangan && Array.isArray(data.keuangan)) setKeuangan(data.keuangan);
            if (data.pengurus && (data.pengurus.rw || data.pengurus.rt13 || data.pengurus.rt14)) {
              setPengurus(prev => ({
                rw: data.pengurus.rw?.nama ? data.pengurus.rw : prev.rw,
                rt13: data.pengurus.rt13?.nama ? data.pengurus.rt13 : prev.rt13,
                rt14: data.pengurus.rt14?.nama ? data.pengurus.rt14 : prev.rt14,
              }));
            }
            if (data.passwords && data.passwords.superadmin) setPasswords(data.passwords);
          }

          console.error("Gagal sinkronisasi Google Sheets:", error);
        } finally {
          setLoading(false);
        }
      };

        loadDataFromGSheet();
      }, []);

        if (!API_URL || API_URL.includes("GANTI_DENGAN_DEPLOYMENT_URL_ANDA")) return;
        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, payload })
          });
        } catch (err) {
          console.error("Gagal kirim data GSheet:", err);
        }
      };

      if (!user) {
        return <LoginScreen onLogin={setUser} passwords={passwords} />;
      }

            return <DataWarga data={warga} user={user} setWarga={setWarga} pengurus={pengurus} sendDataToGSheet={sendDataToGSheet} />;
          case 'statistik': 
            return <Statistik data={warga} />;
          case 'lapor': 
            return <WargaMelapor laporan={laporan} setLaporan={setLaporan} user={user} onZoomImage={setZoomedImage} sendDataToGSheet={sendDataToGSheet} />;

                warga={warga}

                kegiatan={kegiatan}
                pengurus={pengurus}

                setPengumuman={setPengumuman} 
                setKegiatan={setKegiatan} 
                setKeuangan={setKeuangan}
                setPengurus={setPengurus}
                setPasswords={setPasswords}
                sendDataToGSheet={sendDataToGSheet}
              />
            );
          default: 
            return <Beranda warga={warga} pengumuman={pengumuman} kegiatan={kegiatan} pengurus={pengurus} keuangan={keuangan} laporan={laporan} user={user} setPengumuman={setPengumuman} setKegiatan={setKegiatan} onZoomImage={setZoomedImage} sendDataToGSheet={sendDataToGSheet} />;

              <NavButton active={activeTab === 'statistik'} onClick={() => setActiveTab('statistik')} icon={<IconChart size={18}/>} label="Statistik" />
              <NavButton active={activeTab === 'lapor'} onClick={() => setActiveTab('lapor')} icon={<IconAlert size={18}/>} label="Warga Melapor" />

    function DataWarga({ data, user, setWarga, pengurus, sendDataToGSheet }) {
      const [search, setSearch] = useState('');
      const [filterRT, setFilterRT] = useState('Semua');
      const [filterStatus, setFilterStatus] = useState('Semua');
      const [filterLansia, setFilterLansia] = useState(false);
      const [filterYatim, setFilterYatim] = useState(false);

      const dataGrouped = useMemo(() => {
        let filtered = data.filter(w => !w.meninggal); 
        if (search) filtered = filtered.filter(w => w.nama.toLowerCase().includes(search.toLowerCase()));
        if (filterRT !== 'Semua') filtered = filtered.filter(w => String(w.rt) === filterRT);
        if (filterStatus !== 'Semua') filtered = filtered.filter(w => w.status === filterStatus);
        if (filterLansia) filtered = filtered.filter(w => w.lansia);
        if (filterYatim) filtered = filtered.filter(w => w.yatim);

        const grouped = {};
        filtered.forEach(w => {
          if (!grouped[w.no_kk]) grouped[w.no_kk] = [];
          grouped[w.no_kk].push(w);
        });
        return grouped;
      }, [data, search, filterRT, filterStatus, filterLansia, filterYatim]);

      const handleDelete = (id) => {
        if(window.confirm("Hapus warga ini dari daftar?")) {
          setWarga(warga => warga.filter(w => w.id !== id));
          sendDataToGSheet('deleteItem', { sheetName: 'Warga', id });
        }
      };

      const handleToggleStatus = (id, field) => {
        setWarga(warga => warga.map(w => w.id === id ? { ...w, [field]: !w[field] } : w));
      };

      const getBadges = (w) => {
        const badges = [];
        if(w.nama === pengurus.rw?.nama) badges.push('Ketua RW');
        if(w.nama === pengurus.rt13?.nama) badges.push('Ketua RT 13');
        if(w.nama === pengurus.rt14?.nama) badges.push('Ketua RT 14');
        if(w.status === 'Pendatang') badges.push('Warga pendatang');
        if(w.lansia) badges.push('Lansia');
        if(w.yatim) badges.push('Anak yatim');
        return badges;
      };

      const isAdmin = user.role !== 'warga';
      const canEditRT13 = user.role === 'superadmin' || user.role === 'rw' || user.role === 'rt13';
      const canEditRT14 = user.role === 'superadmin' || user.role === 'rw' || user.role === 'rt14';

      return (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
            <div className="relative">
              <IconSearch className="absolute left-3 top-3 text-slate-400" size={18} />
              <input type="text" placeholder="Cari nama warga..." className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border rounded-xl text-sm" value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            
            <div className="flex flex-wrap gap-2 items-center text-xs">
              <span className="font-bold text-slate-500 flex items-center mr-1"><IconFilter size={14} className="mr-1"/> Filter:</span>
              <select className="bg-slate-50 border rounded-lg px-2.5 py-1.5" value={filterRT} onChange={e => setFilterRT(e.target.value)}>
                <option value="Semua">Semua RT</option>
                <option value="13">RT 13</option>
                <option value="14">RT 14</option>
              </select>
              <select className="bg-slate-50 border rounded-lg px-2.5 py-1.5" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
                <option value="Semua">Semua Status</option>
                <option value="Tetap">Warga Tetap</option>
                <option value="Pendatang">Warga Pendatang</option>
              </select>
              <label className="flex items-center space-x-1 cursor-pointer bg-slate-50 px-2.5 py-1.5 rounded-lg border">
                <input type="checkbox" checked={filterLansia} onChange={e => setFilterLansia(e.target.checked)} />
                <span>Lansia</span>
              </label>
              <label className="flex items-center space-x-1 cursor-pointer bg-slate-50 px-2.5 py-1.5 rounded-lg border">
                <input type="checkbox" checked={filterYatim} onChange={e => setFilterYatim(e.target.checked)} />
                <span>Anak Yatim</span>
              </label>
            </div>
          </div>

          {Object.keys(dataGrouped).length === 0 ? (
            <div className="text-center text-slate-400 py-12 bg-white rounded-2xl border text-sm">Data warga tidak ditemukan.</div>
          ) : (
            Object.entries(dataGrouped).map(([kk, anggota]) => {
              const kepala = anggota.find(a => a.peran === 'Kepala Keluarga') || anggota[0];
              return (
                <div key={kk} className="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100">
                  <div className="bg-blue-50/60 px-4 py-3 border-b flex justify-between items-center">
                    <h3 className="font-bold text-slate-800 text-sm">Keluarga Bpk/Ibu {kepala.nama}</h3>
                    <span className="text-xs bg-blue-600 text-white px-2.5 py-0.5 rounded-full font-bold">RT {kepala.rt}</span>
                  </div>
                  
                  <div className="divide-y divide-slate-100">
                    {anggota.map(w => {
                      const hasEditAccess = isAdmin && ((String(w.rt) === '13' && canEditRT13) || (String(w.rt) === '14' && canEditRT14));
                      return (
                        <div key={w.id} className="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                          <div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <p className="font-bold text-slate-800 text-sm">{w.nama}</p>
                              {getBadges(w).map(b => <Badge key={b} type={b} />)}
                            </div>
                            <p className="text-xs text-slate-500 mt-1">Peran: {w.peran} • WA: {w.noWa}</p>
                          </div>

                          {hasEditAccess && (
                            <div className="flex items-center gap-1.5 justify-end w-full sm:w-auto">
                              <button onClick={() => handleToggleStatus(w.id, 'yatim')} className={`text-[11px] px-2 py-1 rounded border ${w.yatim ? 'bg-rose-100 text-rose-700' : 'bg-slate-50'}`}>
                                {w.yatim ? 'Batal Yatim' : '+ Yatim'}
                              </button>
                              <button onClick={() => { if(confirm(`Tandai ${w.nama} meninggal?`)) handleToggleStatus(w.id, 'meninggal'); }} className="text-[11px] px-2 py-1 rounded bg-slate-100">
                                Meninggal
                              </button>
                              <button onClick={() => handleDelete(w.id)} className="text-red-500 bg-red-50 p-1.5 rounded"><IconTrash size={13}/></button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })
          )}
        </div>
      );
    }

    function Statistik({ data }) {
      const currentYear = new Date().getFullYear();
      const currentMonth = new Date().getMonth();

      const wargaAktif = data.filter(w => !w.meninggal);

      const kkRT13 = new Set(wargaAktif.filter(w => String(w.rt) === '13').map(w => w.no_kk)).size;
      const kkRT14 = new Set(wargaAktif.filter(w => String(w.rt) === '14').map(w => w.no_kk)).size;
      const totalKK = kkRT13 + kkRT14;

      const wargaRT13 = wargaAktif.filter(w => String(w.rt) === '13').length;
      const wargaRT14 = wargaAktif.filter(w => String(w.rt) === '14').length;
      const totalWarga = wargaRT13 + wargaRT14;

      const tetapRT13 = wargaAktif.filter(w => String(w.rt) === '13' && w.status === 'Tetap').length;
      const pendatangRT13 = wargaAktif.filter(w => String(w.rt) === '13' && w.status === 'Pendatang').length;
      const tetapRT14 = wargaAktif.filter(w => String(w.rt) === '14' && w.status === 'Tetap').length;
      const pendatangRT14 = wargaAktif.filter(w => String(w.rt) === '14' && w.status === 'Pendatang').length;

      const yatimRT13 = wargaAktif.filter(w => String(w.rt) === '13' && w.yatim).length;
      const yatimRT14 = wargaAktif.filter(w => String(w.rt) === '14' && w.yatim).length;
      const totalYatim = yatimRT13 + yatimRT14;

      let balita=0, anak=0, remaja=0, dewasa=0, lansia=0;
      wargaAktif.forEach(w => {
        if(!w.tglLahir) return;
        const umur = currentYear - new Date(w.tglLahir).getFullYear();
        if(umur <= 4) balita++;
        else if(umur <= 11) anak++;
        else if(umur <= 25) remaja++;
        else if(umur < 65) dewasa++;
        else lansia++;
      });

      const kematianBulanIni = data.filter(w => w.meninggal).length; 
      const kelahiranBulanIni = data.filter(w => {
        if(!w.tglLahir) return false;
        const d = new Date(w.tglLahir);
        return d.getFullYear() === currentYear && d.getMonth() === currentMonth;
      }).length;

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
            <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wide border-b pb-2">📊 Ringkasan Jumlah KK & Warga (RW 07)</h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div className="bg-blue-50 border border-blue-200 rounded-xl p-3.5 text-center">
                <p className="text-xs text-blue-600 font-bold uppercase">Total RW 07</p>
                <p className="text-2xl font-extrabold text-blue-900 mt-1">{totalKK} <span className="text-xs font-normal">KK</span> / {totalWarga} <span className="text-xs font-normal">Jiwa</span></p>
              </div>
              <div className="bg-teal-50 border border-teal-200 rounded-xl p-3.5 text-center">
                <p className="text-xs text-teal-600 font-bold uppercase">RT 13</p>
                <p className="text-2xl font-extrabold text-teal-900 mt-1">{kkRT13} <span className="text-xs font-normal">KK</span> / {wargaRT13} <span className="text-xs font-normal">Jiwa</span></p>
              </div>
              <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3.5 text-center">
                <p className="text-xs text-emerald-600 font-bold uppercase">RT 14</p>
                <p className="text-2xl font-extrabold text-emerald-900 mt-1">{kkRT14} <span className="text-xs font-normal">KK</span> / {wargaRT14} <span className="text-xs font-normal">Jiwa</span></p>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wide mb-3">🏠 Status Warga (Tetap vs Pendatang)</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left text-slate-600">
                <thead className="bg-slate-50 font-bold uppercase">
                  <tr>
                    <th className="p-2.5">Wilayah</th>
                    <th className="p-2.5">Warga Tetap</th>
                    <th className="p-2.5">Warga Pendatang</th>
                    <th className="p-2.5">Total Warga</th>
                  </tr>

    function WargaMelapor({ laporan, setLaporan, user, onZoomImage, sendDataToGSheet }) {

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setFormData({ ...formData, foto: reader.result });
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const newLaporan = { ...formData, id: Date.now(), status: 'Dalam Pengecekan', tanggal: new Date().toISOString().split('T')[0] };
        setLaporan([newLaporan, ...laporan]);
        sendDataToGSheet('addLaporan', newLaporan);
        setFormData({ pelapor: '', jenis: 'Keamanan', uraian: '', lokasi: '', darurat: false, foto: null });
        alert("Laporan Anda berhasil terkirim!");
      };

      const updateStatus = (id, newStatus) => {
        setLaporan(laporan.map(l => l.id === id ? { ...l, status: newStatus } : l));
        sendDataToGSheet('updateLaporanStatus', { id, status: newStatus });
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <h3 className="font-bold text-slate-800 mb-4 flex items-center text-sm uppercase tracking-wide">
              <IconAlert className="mr-2 text-orange-500" size={18}/> Form Pengaduan / Laporan Warga

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                  <label className="block font-semibold text-slate-700 mb-1">Nama Pelapor</label>
                  <input required type="text" placeholder="Nama Anda" className="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-xs" value={formData.pelapor} onChange={e => setFormData({...formData, pelapor: e.target.value})} />

                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Jenis Laporan</label>
                  <select className="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-xs" value={formData.jenis} onChange={e => setFormData({...formData, jenis: e.target.value})}>

              </div>
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Lokasi Kejadian</label>

              </div>
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Uraian Laporan</label>
                <textarea required rows="3" placeholder="Jelaskan detail pengaduan..." className="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-xs" value={formData.uraian} onChange={e => setFormData({...formData, uraian: e.target.value})}></textarea>
              </div>
              
              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-1">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Foto Lokasi (Opsional)</label>
                  <input type="file" accept="image/*" onChange={handlePhotoUpload} className="text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700" />
                </div>
                <label className="flex items-center space-x-2 bg-red-50 text-red-700 px-3 py-2 rounded-xl border border-red-200 cursor-pointer">

          <div className="space-y-3">
            <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wide">Daftar Laporan Warga</h3>
            {laporan.map(l => (

                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-bold text-slate-800 text-sm">{l.jenis}</span>
                    {l.darurat && <Badge type="Darurat" />}
                    <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-slate-100">{l.status}</span>

                  <span className="text-[10px] text-slate-400">{l.tanggal}</span>

                {user.role !== 'warga' && (

                    <button onClick={() => updateStatus(l.id, 'Sedang diKerjakan')} className="text-[10px] bg-blue-50 text-blue-700 px-2.5 py-1 rounded border">Kerjakan</button>
                    <button onClick={() => updateStatus(l.id, 'Selesai')} className="text-[10px] bg-green-50 text-green-700 px-2.5 py-1 rounded border">Selesai</button>

                )}

            ))}

        </div>
      );
    }

    function Keuangan({ keuangan }) {
      const getSaldo = (jenis) => keuangan.filter(k => k.jenis_kas === jenis).reduce((acc, curr) => curr.tipe === 'Masuk' ? acc + Number(curr.nominal) : acc - Number(curr.nominal), 0);
      const saldoWajib = getSaldo('Wajib');
      const saldoLain = getSaldo('Lain-lain');
      const total = saldoWajib + saldoLain;

      const renderRincianPengeluaran = (jenis) => {
        const pengeluaranList = keuangan.filter(k => k.jenis_kas === jenis && k.tipe === 'Keluar');
        const totalPemasukan = keuangan.filter(k => k.jenis_kas === jenis && k.tipe === 'Masuk').reduce((a, b) => a + Number(b.nominal), 0);

        return (
          <div className="mt-3 text-xs space-y-2">
            <div className="bg-slate-50 p-2.5 rounded-lg flex justify-between font-medium text-slate-700">
              <span>Total Pemasukan (Global):</span>
              <span className="text-green-600 font-bold">{formatRupiah(totalPemasukan)}</span>
            </div>

            <div>
              <p className="font-bold text-slate-700 mb-1.5">Rincian Pengeluaran:</p>
              {pengeluaranList.length === 0 ? <p className="text-[11px] text-slate-400 italic">Belum ada pengeluaran.</p> : (
                <ul className="space-y-1.5">
                  {pengeluaranList.map(k => (
                    <li key={k.id} className="flex justify-between items-center p-2 bg-red-50/50 rounded-lg border border-red-100">
                      <div>
                        <p className="font-medium text-slate-800">{k.keterangan}</p>
                        <p className="text-[9px] text-slate-400">{k.tanggal}</p>
                      </div>
                      <span className="font-bold text-red-600">-{formatRupiah(k.nominal)}</span>
                    </li>
                  ))}
                </ul>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className="space-y-4">
          <div className="bg-gradient-to-br from-blue-700 to-blue-900 rounded-2xl p-6 text-white text-center shadow-md">
            <p className="text-blue-200 text-xs font-semibold uppercase tracking-wider mb-1">Total Saldo Kas Terseedia</p>
            <h2 className="text-3xl font-extrabold">{formatRupiah(total)}</h2>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
              <div className="flex justify-between items-center border-b pb-2">
                <div><h3 className="font-bold text-slate-800 text-sm">Iuran Wajib</h3><p className="text-[10px] text-slate-400">Sisa Kas Wajib</p></div>
                <span className="text-blue-700 font-extrabold text-base">{formatRupiah(saldoWajib)}</span>
              </div>
              {renderRincianPengeluaran('Wajib')}
            </div>

            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
              <div className="flex justify-between items-center border-b pb-2">
                <div><h3 className="font-bold text-slate-800 text-sm">Iuran Lain-Lain</h3><p className="text-[10px] text-slate-400">Sisa Kas Lainnya</p></div>
                <span className="text-orange-600 font-extrabold text-base">{formatRupiah(saldoLain)}</span>
              </div>
              {renderRincianPengeluaran('Lain-lain')}
            </div>
          </div>

          <div className="bg-orange-50 border border-orange-200 rounded-xl p-3.5 text-center">
            <p className="text-xs text-orange-900 font-semibold">Informasi lebih lanjut silahkan hubungi Bendahara.</p>
          </div>
        </div>
      );
    }

    function FiturAdmin({ user, warga, pengumuman, kegiatan, pengurus, passwords, setPengumuman, setKegiatan, setKeuangan, setPengurus, setPasswords, sendDataToGSheet }) {
      const [nominalDisplay, setNominalDisplay] = useState('');
      const [nominalRaw, setNominalRaw] = useState(0);
      const [jenisKas, setJenisKas] = useState('Wajib');
      const [tipeTx, setTipeTx] = useState('Masuk');
      const [penyetorTx, setPenyetorTx] = useState('');
      const [keteranganTx, setKeteranganTx] = useState('');

      const [namaKegiatan, setNamaKegiatan] = useState('');
      const [tglKegiatan, setTglKegiatan] = useState('');
      const [fotoKegiatan, setFotoKegiatan] = useState(null);

      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [selectedRW, setSelectedRW] = useState(pengurus.rw?.nama || '');
      const [selectedRT13, setSelectedRT13] = useState(pengurus.rt13?.nama || '');
      const [selectedRT14, setSelectedRT14] = useState(pengurus.rt14?.nama || '');

      const [passSuper, setPassSuper] = useState(passwords.superadmin || 'jakun123');
      const [passRW, setPassRW] = useState(passwords.rw || 'jakun321');
      const [passRT13, setPassRT13] = useState(passwords.rt13 || 'jakun321');
      const [passRT14, setPassRT14] = useState(passwords.rt14 || 'jakun321');

      // Update state modal setiap kali modal dibuka agar memilih nama yang aktif
      useEffect(() => {
        if (showSettingsModal) {
          setSelectedRW(pengurus.rw?.nama || (warga[0]?.nama || ''));
          setSelectedRT13(pengurus.rt13?.nama || (warga.find(w => String(w.rt) === '13')?.nama || ''));
          setSelectedRT14(pengurus.rt14?.nama || (warga.find(w => String(w.rt) === '14')?.nama || ''));
        }
      }, [showSettingsModal]);

      const handleNominalChange = (e) => {
        const rawVal = e.target.value.replace(/\D/g, '');
        if (!rawVal) { setNominalDisplay(''); setNominalRaw(0); return; }
        const numberVal = parseInt(rawVal, 10);
        setNominalRaw(numberVal);
        setNominalDisplay(new Intl.NumberFormat('id-ID').format(numberVal));
      };

      const handleAddKeuangan = (e) => {
        e.preventDefault();
        if (nominalRaw <= 0) { alert("Nominal tidak valid!"); return; }
        const newTx = {
          id: Date.now(),
          jenis_kas: jenisKas,
          tipe: tipeTx,
          nominal: nominalRaw,
          penyetor: tipeTx === 'Masuk' ? penyetorTx : '',
          keterangan: keteranganTx,
          tanggal: new Date().toISOString().split('T')[0]
        };
        setKeuangan(prev => [newTx, ...prev]);
        sendDataToGSheet('addKeuangan', newTx);
        setNominalDisplay(''); setNominalRaw(0); setKeteranganTx(''); setPenyetorTx('');
        alert("Transaksi disimpan!");
      };

      const handleAddPengumuman = (e) => {
        e.preventDefault();
        const judul = e.target.judul.value;
        const uraian = e.target.uraian.value;
        const newP = { id: Date.now(), judul, uraian, tanggal: new Date().toISOString().split('T')[0] };
        setPengumuman(prev => [newP, ...prev]);
        sendDataToGSheet('addPengumuman', newP);
        e.target.reset();
        alert("Pengumuman dipublikasikan!");
      };

      const handleFotoKegiatanUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setFotoKegiatan(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleAddKegiatan = (e) => {
        e.preventDefault();
        const newK = { id: Date.now(), nama: namaKegiatan, tanggal: tglKegiatan, foto: fotoKegiatan };
        setKegiatan(prev => [newK, ...prev]);
        sendDataToGSheet('addKegiatan', newK);
        setNamaKegiatan(''); setTglKegiatan(''); setFotoKegiatan(null);
        alert("Kegiatan ditambahkan!");
      };

      // PERBAIKAN: Fungsi simpan pengaturan pengurus & password admin
      const handleSaveSettings = (e) => {
        e.preventDefault();

        // Cari data warga lengkap berdasarkan nama yang dipilih di dropdown
        const dataRW = warga.find(w => w.nama === selectedRW);
        const dataRT13 = warga.find(w => w.nama === selectedRT13);
        const dataRT14 = warga.find(w => w.nama === selectedRT14);

        const updatedPengurus = {
          rw: { 
            nama: selectedRW, 
            wa: dataRW && dataRW.noWa && dataRW.noWa !== '-' ? dataRW.noWa : (pengurus.rw?.wa || '081234567890') 
          },
          rt13: { 
            nama: selectedRT13, 
            wa: dataRT13 && dataRT13.noWa && dataRT13.noWa !== '-' ? dataRT13.noWa : (pengurus.rt13?.wa || '081298765432') 
          },
          rt14: { 
            nama: selectedRT14, 
            wa: dataRT14 && dataRT14.noWa && dataRT14.noWa !== '-' ? dataRT14.noWa : (pengurus.rt14?.wa || '081345678901') 
          }
        };

        const updatedPasswords = { 
          superadmin: passSuper, 
          rw: passRW, 
          rt13: passRT13, 
          rt14: passRT14 
        };

        // Perbarui State Lokal
        setPengurus(updatedPengurus);
        setPasswords(updatedPasswords);

        // Kirim Ke Google Sheets
        sendDataToGSheet('updateSettings', { pengurus: updatedPengurus, passwords: updatedPasswords });

        setShowSettingsModal(false);
        alert("Pengaturan susunan pengurus & password berhasil diperbarui!");
      };

      return (
        <div className="space-y-6">
          <div className="bg-orange-50 text-orange-900 p-3.5 rounded-xl text-xs font-semibold border border-orange-200 flex justify-between items-center">
            <span>Akses Admin: {user.role === 'superadmin' ? 'SUPER ADMIN' : user.role.toUpperCase()}</span>
            {user.role === 'superadmin' && (
              <button onClick={() => setShowSettingsModal(true)} className="bg-orange-600 text-white px-3 py-1 rounded-lg text-xs font-bold flex items-center space-x-1">
                <IconSettings size={14} />
                <span>Pengaturan</span>
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-white rounded-2xl p-5 shadow-sm border">
              <h3 className="font-bold text-slate-800 mb-3 text-xs uppercase border-b pb-2">📢 Input Pengumuman Baru</h3>
              <form onSubmit={handleAddPengumuman} className="space-y-3 text-xs">
                <input required name="judul" type="text" placeholder="Judul Pengumuman" className="w-full p-2.5 border rounded-xl bg-slate-50" />
                <textarea required name="uraian" rows="3" placeholder="Uraian..." className="w-full p-2.5 border rounded-xl bg-slate-50"></textarea>
                <button type="submit" className="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold">Terbitkan</button>
              </form>
            </div>

            <div className="bg-white rounded-2xl p-5 shadow-sm border">
              <h3 className="font-bold text-slate-800 mb-3 text-xs uppercase border-b pb-2">📅 Input Kegiatan Baru</h3>
              <form onSubmit={handleAddKegiatan} className="space-y-3 text-xs">
                <input required type="text" placeholder="Nama Kegiatan" value={namaKegiatan} onChange={e => setNamaKegiatan(e.target.value)} className="w-full p-2.5 border rounded-xl bg-slate-50" />
                <input required type="date" value={tglKegiatan} onChange={e => setTglKegiatan(e.target.value)} className="w-full p-2.5 border rounded-xl bg-slate-50" />
                <input type="file" accept="image/*" onChange={handleFotoKegiatanUpload} className="text-xs file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-orange-50 file:text-orange-700" />
                <button type="submit" className="w-full bg-orange-500 text-white py-2.5 rounded-xl font-bold">Simpan Kegiatan</button>
              </form>
            </div>
          </div>

          <div className="bg-white rounded-2xl p-5 shadow-sm border">
            <h3 className="font-bold text-slate-800 mb-3 text-xs uppercase border-b pb-2">💰 Input Transaksi Keuangan</h3>
            <form onSubmit={handleAddKeuangan} className="space-y-3 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <select value={jenisKas} onChange={e => setJenisKas(e.target.value)} className="p-2.5 border rounded-xl bg-slate-50">
                  <option value="Wajib">Iuran Wajib</option>
                  <option value="Lain-lain">Iuran Lain-lain</option>
                </select>
                <select value={tipeTx} onChange={e => setTipeTx(e.target.value)} className="p-2.5 border rounded-xl bg-slate-50">
                  <option value="Masuk">Pemasukan (+)</option>
                  <option value="Keluar">Pengeluaran (-)</option>
                </select>
              </div>

              {tipeTx === 'Masuk' && (
                <input required type="text" placeholder="Nama Penyetor / Pembayar (Untuk Database)" value={penyetorTx} onChange={e => setPenyetorTx(e.target.value)} className="w-full p-2.5 border rounded-xl bg-slate-50" />
              )}

              <div className="relative">
                <span className="absolute left-3 top-2.5 font-bold text-slate-400">Rp</span>
                <input required type="text" placeholder="0" value={nominalDisplay} onChange={handleNominalChange} className="w-full pl-10 pr-4 py-2.5 border rounded-xl bg-slate-50 font-bold" />

              <input required type="text" placeholder="Keterangan Transaksi" value={keteranganTx} onChange={e => setKeteranganTx(e.target.value)} className="w-full p-2.5 border rounded-xl bg-slate-50" />
              <button type="submit" className="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold">Simpan Transaksi</button>

          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">

                <form onSubmit={handleSaveSettings} className="space-y-4 text-xs">
                  <div className="bg-slate-50 p-3 rounded-xl border space-y-3">
                    <h4 className="font-bold border-b pb-1 text-slate-700">1. Atur Pengurus (Diambil dari Data Warga)</h4>
                    
                    <div>
                      <label className="block font-semibold mb-1 text-slate-600">Ketua RW 07</label>
                      <select value={selectedRW} onChange={e => setSelectedRW(e.target.value)} className="w-full p-2 border rounded-lg bg-white font-medium">
                        {warga.map(w => <option key={w.id} value={w.nama}>{w.nama} (RT {w.rt})</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold mb-1 text-slate-600">Ketua RT 13</label>
                      <select value={selectedRT13} onChange={e => setSelectedRT13(e.target.value)} className="w-full p-2 border rounded-lg bg-white font-medium">
                        {warga.filter(w => String(w.rt) === '13').map(w => <option key={w.id} value={w.nama}>{w.nama}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold mb-1 text-slate-600">Ketua RT 14</label>
                      <select value={selectedRT14} onChange={e => setSelectedRT14(e.target.value)} className="w-full p-2 border rounded-lg bg-white font-medium">
                        {warga.filter(w => String(w.rt) === '14').map(w => <option key={w.id} value={w.nama}>{w.nama}</option>)}
                      </select>

                  <div className="bg-slate-50 p-3 rounded-xl border space-y-2">
                    <h4 className="font-bold border-b pb-1 text-slate-700">2. Atur Password Admin</h4>
                    <div>
                      <label className="block font-semibold mb-0.5 text-slate-600">Password Super Admin</label>
                      <input type="text" value={passSuper} onChange={e => setPassSuper(e.target.value)} className="w-full p-2 border rounded-lg font-mono bg-white" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-0.5 text-slate-600">Password Ketua RW</label>
                      <input type="text" value={passRW} onChange={e => setPassRW(e.target.value)} className="w-full p-2 border rounded-lg font-mono bg-white" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-0.5 text-slate-600">Password Ketua RT 13</label>
                      <input type="text" value={passRT13} onChange={e => setPassRT13(e.target.value)} className="w-full p-2 border rounded-lg font-mono bg-white" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-0.5 text-slate-600">Password Ketua RT 14</label>
                      <input type="text" value={passRT14} onChange={e => setPassRT14(e.target.value)} className="w-full p-2 border rounded-lg font-mono bg-white" />
                    </div>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setShowSettingsModal(false)} className="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-bold">Batal</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">Simpan Pengaturan</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render App ke DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
